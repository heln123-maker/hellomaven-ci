---
- name: Deploy Maven Artifact
  hosts: localhost
  become: no
  tasks:
    - name: Create deployment directory if it does not exist
      ansible.builtin.file:
        path: /opt/deployment
        state: directory
        mode: '0755'

    - name: Copy the artifact to the deployment directory
      ansible.builtin.copy:
        src: "/var/lib/jenkins/workspace/hellomaven/target/hellomaven-ci-1.0-SNAPSHOT.jar"
        dest: "/path/to/remote/deployment/directory/hellomaven-ci-1.0-SNAPSHOT.jar"
